<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小勇士任务 - 我的任务</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <!-- 使用系统默认无衬线字体作为后备方案 -->
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background: linear-gradient(135deg, #FFE5E5 0%, #E5F3FF 50%, #E5FFE5 100%);
            min-height: 100vh;
        }
        .hero-bg {
            background-image: url('hero-background.png');
            background-size: cover;
            background-position: center;
        }
        .card-shadow {
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .gradient-text {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .floating-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .bounce-animation {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .task-card {
            transition: all 0.3s ease;
        }
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .progress-ring {
            transform: rotate(-90deg);
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="pb-20">
    <!-- Hero Section -->
    <div class="hero-bg h-40 flex items-center justify-center relative overflow-hidden">
        <div class="absolute inset-0 bg-white bg-opacity-20"></div>
        <div class="relative text-center z-10">
            <div class="floating-animation">
                <h1 class="text-2xl font-bold gradient-text mb-1">你好，小勇士！</h1>
                <p class="text-gray-700 text-sm">今天也要加油完成任务哦！</p>
            </div>
        </div>
        <!-- Floating Stars -->
        <div class="absolute top-4 left-4 w-6 h-6 bg-yellow-300 rounded-full opacity-70 floating-animation"></div>
        <div class="absolute top-8 right-6 w-4 h-4 bg-pink-300 rounded-full opacity-60 floating-animation" style="animation-delay: 1s;"></div>
    </div>

    <!-- Points Display -->
    <div class="px-4 -mt-6 relative z-20 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow text-center">
            <div class="flex items-center justify-center space-x-4">
                <div class="relative w-16 h-16">
                    <svg class="progress-ring w-16 h-16" viewBox="0 0 120 120">
                        <circle class="progress-ring-circle" stroke="#E5E5E5" stroke-width="8" fill="transparent" r="52" cx="60" cy="60"/>
                        <circle id="progressCircle" class="progress-ring-circle" stroke="#FF6B6B" stroke-width="8" fill="transparent" r="52" cx="60" cy="60" stroke-dasharray="326.73" stroke-dashoffset="163.37"/>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <span class="text-lg font-bold text-pink-500" id="currentPoints">128</span>
                    </div>
                </div>
                <div class="text-left">
                    <div class="text-sm text-gray-600">当前积分</div>
                    <div class="text-xs text-gray-500 mt-1">距离下个心愿还需 <span id="pointsNeeded">72</span> 积分</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Today's Tasks -->
    <div class="px-4 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-gray-800">今日任务</h3>
                <div class="text-sm text-gray-500" id="taskProgress">2/5 已完成</div>
            </div>
            
            <!-- Task List -->
            <div id="childTaskList" class="space-y-3">
                <!-- Tasks will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="px-4 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">快速操作</h3>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="showWishes()" class="bg-gradient-to-r from-yellow-400 to-yellow-500 text-white py-3 px-4 rounded-xl font-medium text-sm hover:shadow-lg transition-all duration-300 transform hover:scale-105">
                    ⭐ 我的心愿
                </button>
                <button onclick="showAchievements()" class="bg-gradient-to-r from-purple-400 to-purple-500 text-white py-3 px-4 rounded-xl font-medium text-sm hover:shadow-lg transition-all duration-300 transform hover:scale-105">
                    🏆 我的成就
                </button>
            </div>
        </div>
    </div>

    <!-- Recent Achievements -->
    <div class="px-4 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">最近成就</h3>
            <div id="recentAchievements" class="space-y-2">
                <!-- Achievements will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Task Completion Modal -->
    <div id="completeTaskModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md card-shadow">
            <div class="text-center mb-4">
                <div class="text-4xl mb-2">🎉</div>
                <h3 class="text-xl font-semibold text-gray-800">完成任务</h3>
            </div>
            
            <div id="taskCompletionContent">
                <!-- Content will be populated by JavaScript -->
            </div>
            
            <div class="mt-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">完成说明（可选）</label>
                <textarea id="completionNote" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" rows="3" placeholder="描述一下你是如何完成这个任务的..."></textarea>
            </div>
            
            <div class="flex space-x-3 mt-4">
                <button onclick="hideCompleteTask()" class="flex-1 bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-medium text-sm">取消</button>
                <button onclick="submitTaskCompletion()" class="flex-1 bg-gradient-to-r from-green-400 to-green-500 text-white py-2 px-4 rounded-lg font-medium text-sm">提交完成</button>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 w-full max-w-md card-shadow text-center">
            <div class="text-6xl mb-4 bounce-animation">🎉</div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">太棒了！</h3>
            <p class="text-gray-600 mb-4">你成功完成了任务！</p>
            <div class="bg-yellow-50 rounded-xl p-4 mb-4">
                <div class="text-lg font-bold text-yellow-600" id="earnedPoints">+10 积分</div>
            </div>
            <button onclick="hideSuccessModal()" class="w-full bg-gradient-to-r from-pink-400 to-pink-500 text-white py-3 px-4 rounded-xl font-medium">
                继续加油！
            </button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-30">
        <div class="flex justify-around py-2">
            <a href="index.html" id="parentSwitchLink" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">📋</div>
                <span class="text-xs">家长管理</span>
            </a>
            <a href="child-view.html" class="flex flex-col items-center py-2 px-4 text-pink-500">
                <div class="text-xl mb-1">👶</div>
                <span class="text-xs font-medium">我的任务</span>
            </a>
            <a href="wishes.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">🌟</div>
                <span class="text-xs">心愿管理</span>
            </a>
            <a href="rewards.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">🏆</div>
                <span class="text-xs">成就统计</span>
            </a>
            <a href="help.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">❓</div>
                <span class="text-xs">帮助</span>
            </a>
            <a href="login.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">🚪</div>
                <span class="text-xs">切换角色</span>
            </a>
        </div>
    </nav>

    <div id="parentSwitchModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md card-shadow">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">切换到家长管理</h3>
            <p class="text-xs text-gray-600 mb-3">请输入家长密码以完成切换。</p>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">家长密码</label>
                <input type="password" id="parentSwitchPassword" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="请输入家长密码">
            </div>
            <div class="flex space-x-3">
                <button onclick="hideParentSwitchModal()" class="flex-1 bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-medium text-sm">取消</button>
                <button onclick="confirmParentSwitch()" class="flex-1 bg-blue-500 text-white py-2 px-4 rounded-lg font-medium text-sm">确认切换</button>
            </div>
        </div>
    </div>

    <script>
        // 角色检查
        document.addEventListener('DOMContentLoaded', () => {
            const userRole = localStorage.getItem('userRole');
            const loginTime = localStorage.getItem('loginTime');
            
            // 检查是否已登录
            if (!userRole || !loginTime) {
                window.location.href = 'login.html';
                return;
            }
            
            // 检查登录是否过期（24小时）
            const loginDate = new Date(loginTime);
            const now = new Date();
            const hoursDiff = (now - loginDate) / (1000 * 60 * 60);
            
            if (hoursDiff > 24) {
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }
            
            // 如果不是孩子角色，跳转到相应界面
            if (userRole !== 'child') {
                if (userRole === 'parent') {
                    window.location.href = 'index.html';
                } else {
                    window.location.href = 'login.html';
                }
                return;
            }
        });
    </script>
    <script src="child-view.js"></script>
</body>
</html>
