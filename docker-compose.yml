version: '3.8'

services:
  learning-garden:
    build: .
    container_name: learning-garden
    ports:
      - "8080:80"
    restart: unless-stopped

  sync-server:
    build: ./server
    container_name: learning-garden-sync
    ports:
      - "8787:8787"
    volumes:
      - ./server/data:/app/data
    restart: unless-stopped
