<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小勇士任务 - 心愿管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        (function(){
            if(typeof window.echarts==='undefined'){
                var urls=['https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js','https://unpkg.com/echarts@5.4.3/dist/echarts.min.js'];
                var i=0;
                function load(){
                    var s=document.createElement('script');
                    s.src=urls[i++];
                    s.onerror=function(){ if(i<urls.length) load(); };
                    document.head.appendChild(s);
                }
                load();
            }
        })();
    </script>
    <!-- 使用系统默认无衬线字体作为后备方案 -->
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background: linear-gradient(135deg, #FFE5E5 0%, #E5F3FF 50%, #E5FFE5 100%);
            min-height: 100vh;
        }
        .hero-bg {
            background-image: url('hero-background.png');
            background-size: cover;
            background-position: center;
        }
        .card-shadow {
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .gradient-text {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .floating-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .wish-card {
            transition: all 0.3s ease;
        }
        .wish-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .progress-bar {
            transition: width 0.5s ease;
        }
        .sparkle-animation {
            animation: sparkle 1.5s infinite;
        }
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }
    </style>
</head>
<body class="pb-20">
    <!-- Hero Section -->
    <div class="hero-bg h-40 flex items-center justify-center relative overflow-hidden">
        <div class="absolute inset-0 bg-white bg-opacity-20"></div>
        <div class="relative text-center z-10">
            <div class="floating-animation">
                <h1 class="text-2xl font-bold gradient-text mb-1">我的心愿</h1>
                <p class="text-gray-700 text-sm">用积分兑换梦想成真的时刻</p>
            </div>
        </div>
        <!-- Floating Stars -->
        <div class="absolute top-4 left-4 w-6 h-6 bg-yellow-300 rounded-full opacity-70 floating-animation"></div>
        <div class="absolute top-8 right-6 w-4 h-4 bg-pink-300 rounded-full opacity-60 floating-animation" style="animation-delay: 1s;"></div>
    </div>

    <!-- Points Summary -->
    <div class="px-4 -mt-6 relative z-20 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <div class="flex items-center justify-between">
                <div class="text-center flex-1">
                    <div class="text-2xl font-bold text-pink-500" id="currentPointsDisplay">128</div>
                    <div class="text-xs text-gray-600">当前积分</div>
                </div>
                <div class="w-px h-12 bg-gray-200"></div>
                <div class="text-center flex-1">
                    <div class="text-2xl font-bold text-yellow-500" id="totalWishesDisplay">3</div>
                    <div class="text-xs text-gray-600">我的心愿</div>
                </div>
                <div class="w-px h-12 bg-gray-200"></div>
                <div class="text-center flex-1">
                    <div class="text-2xl font-bold text-green-500" id="fulfilledWishesDisplay">1</div>
                    <div class="text-xs text-gray-600">已实现</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Wish Button -->
    <div class="px-4 mb-6">
        <button onclick="showAddWish()" class="w-full bg-gradient-to-r from-yellow-400 to-yellow-500 text-white py-4 px-4 rounded-xl font-medium text-lg hover:shadow-lg transition-all duration-300 transform hover:scale-105">
            ✨ 添加新心愿
        </button>
    </div>

    <!-- Wishes List -->
    <div class="px-4 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">我的心愿清单</h3>
            <div id="wishesList" class="space-y-4">
                <!-- Wishes will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Wish Progress Chart -->
    <div class="px-4 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">心愿进度统计</h3>
            <div id="wishProgressChart" style="height: 200px;"></div>
        </div>
    </div>

    <!-- Add Wish Modal -->
    <div id="addWishModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md card-shadow">
            <div class="text-center mb-4">
                <div class="text-4xl mb-2">✨</div>
                <h3 class="text-xl font-semibold text-gray-800">添加新心愿</h3>
            </div>
            
            <form id="addWishForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">心愿名称</label>
                    <input type="text" id="wishName" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="例如：想要一个新玩具" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">心愿描述</label>
                    <textarea id="wishDescription" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" rows="3" placeholder="详细描述你的心愿..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">心愿优先级</label>
                    <select id="wishPriority" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="high">🔴 高优先级</option>
                        <option value="medium" selected>🟡 中优先级</option>
                        <option value="low">🟢 低优先级</option>
                    </select>
                </div>
                <div class="flex space-x-3">
                    <button type="button" onclick="hideAddWish()" class="flex-1 bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-medium text-sm">取消</button>
                    <button type="submit" class="flex-1 bg-gradient-to-r from-yellow-400 to-yellow-500 text-white py-2 px-4 rounded-lg font-medium text-sm">添加心愿</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Wish Detail Modal -->
    <div id="wishDetailModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md card-shadow">
            <div id="wishDetailContent">
                <!-- Content will be populated by JavaScript -->
            </div>
            <div class="flex space-x-3 mt-4">
                <button onclick="hideWishDetail()" class="flex-1 bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-medium text-sm">关闭</button>
                <button id="redeemButton" onclick="redeemWish()" class="flex-1 bg-gradient-to-r from-green-400 to-green-500 text-white py-2 px-4 rounded-lg font-medium text-sm">兑换心愿</button>
            </div>
        </div>
    </div>

    <!-- Redeem Confirmation Modal -->
    <div id="redeemModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 w-full max-w-md card-shadow text-center">
            <div class="text-6xl mb-4 sparkle-animation">🎉</div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">心愿兑换成功！</h3>
            <p class="text-gray-600 mb-4">恭喜你实现了这个心愿！</p>
            <div class="bg-yellow-50 rounded-xl p-4 mb-4">
                <div class="text-sm text-gray-700 mb-1">消耗积分</div>
                <div class="text-xl font-bold text-yellow-600" id="redeemedPoints">-100 积分</div>
            </div>
            <button onclick="hideRedeemModal()" class="w-full bg-gradient-to-r from-pink-400 to-pink-500 text-white py-3 px-4 rounded-xl font-medium">
                太棒了！
            </button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-30">
        <div class="flex justify-around py-2">
            <a href="index.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">📋</div>
                <span class="text-xs">家长管理</span>
            </a>
            <a href="child-view.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">👶</div>
                <span class="text-xs">我的任务</span>
            </a>
            <a href="wishes.html" class="flex flex-col items-center py-2 px-4 text-yellow-500">
                <div class="text-xl mb-1">🌟</div>
                <span class="text-xs font-medium">心愿管理</span>
            </a>
            <a href="rewards.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">🏆</div>
                <span class="text-xs">成就统计</span>
            </a>
            <a href="help.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">❓</div>
                <span class="text-xs">帮助</span>
            </a>
            <a href="login.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">🚪</div>
                <span class="text-xs">切换角色</span>
            </a>
        </div>
    </nav>

    <script>
        // 角色检查
        document.addEventListener('DOMContentLoaded', () => {
            const userRole = localStorage.getItem('userRole');
            const loginTime = localStorage.getItem('loginTime');
            if (!userRole || !loginTime) {
                window.location.href = 'login.html';
                return;
            }
            const loginDate = new Date(loginTime);
            const now = new Date();
            const hoursDiff = (now - loginDate) / (1000 * 60 * 60);
            if (hoursDiff > 24) {
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }
        });
    </script>
    <script src="wishes.js"></script>
</body>
</html>
