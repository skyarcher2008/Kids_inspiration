<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小勇士任务 - 成就统计</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        (function(){
            if(typeof window.echarts==='undefined'){
                var urls=['https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js','https://unpkg.com/echarts@5.4.3/dist/echarts.min.js'];
                var i=0;
                function load(){
                    var s=document.createElement('script');
                    s.src=urls[i++];
                    s.onerror=function(){ if(i<urls.length) load(); };
                    document.head.appendChild(s);
                }
                load();
            }
        })();
    </script>
    <!-- 使用系统默认无衬线字体作为后备方案 -->
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background: linear-gradient(135deg, #FFE5E5 0%, #E5F3FF 50%, #E5FFE5 100%);
            min-height: 100vh;
        }
        .hero-bg {
            background-image: url('hero-background.png');
            background-size: cover;
            background-position: center;
        }
        .card-shadow {
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .gradient-text {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .floating-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .achievement-card {
            transition: all 0.3s ease;
        }
        .achievement-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .achievement-unlocked {
            animation: achievementUnlock 0.6s ease-out;
        }
        @keyframes achievementUnlock {
            0% { transform: scale(0.8) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .sparkle-animation {
            animation: sparkle 1.5s infinite;
        }
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }
    </style>
</head>
<body class="pb-20">
    <!-- Hero Section -->
    <div class="hero-bg h-40 flex items-center justify-center relative overflow-hidden">
        <div class="absolute inset-0 bg-white bg-opacity-20"></div>
        <div class="relative text-center z-10">
            <div class="floating-animation">
                <h1 class="text-2xl font-bold gradient-text mb-1">成就统计</h1>
                <p class="text-gray-700 text-sm">记录你的成长足迹</p>
            </div>
        </div>
        <!-- Floating Stars -->
        <div class="absolute top-4 left-4 w-6 h-6 bg-yellow-300 rounded-full opacity-70 floating-animation"></div>
        <div class="absolute top-8 right-6 w-4 h-4 bg-pink-300 rounded-full opacity-60 floating-animation" style="animation-delay: 1s;"></div>
    </div>

    <!-- Stats Overview -->
    <div class="px-4 -mt-6 relative z-20 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <div class="grid grid-cols-4 gap-3 text-center">
                <div>
                    <div class="text-xl font-bold text-pink-500" id="totalTasksCompleted">12</div>
                    <div class="text-xs text-gray-600">完成任务</div>
                </div>
                <div>
                    <div class="text-xl font-bold text-blue-500" id="totalPointsEarned">156</div>
                    <div class="text-xs text-gray-600">获得积分</div>
                </div>
                <div>
                    <div class="text-xl font-bold text-yellow-500" id="totalAchievements">6</div>
                    <div class="text-xs text-gray-600">解锁成就</div>
                </div>
                <div>
                    <div class="text-xl font-bold text-green-500" id="currentStreak">3</div>
                    <div class="text-xs text-gray-600">连续天数</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Achievements Section -->
    <div class="px-4 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">我的成就</h3>
            <div id="achievementsList" class="grid grid-cols-2 gap-3">
                <!-- Achievements will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Progress Charts -->
    <div class="px-4 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">成长曲线</h3>
            <div id="progressChart" style="height: 250px;"></div>
        </div>
    </div>

    <!-- Weekly Stats -->
    <div class="px-4 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">本周统计</h3>
            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="bg-pink-50 rounded-xl p-3">
                    <div class="text-2xl mb-1">📋</div>
                    <div class="text-lg font-bold text-pink-500" id="weeklyTasks">8</div>
                    <div class="text-xs text-gray-600">本周任务</div>
                </div>
                <div class="bg-blue-50 rounded-xl p-3">
                    <div class="text-2xl mb-1">⭐</div>
                    <div class="text-lg font-bold text-blue-500" id="weeklyPoints">95</div>
                    <div class="text-xs text-gray-600">本周积分</div>
                </div>
                <div class="bg-green-50 rounded-xl p-3">
                    <div class="text-2xl mb-1">🎯</div>
                    <div class="text-lg font-bold text-green-500" id="completionRate">75%</div>
                    <div class="text-xs text-gray-600">完成率</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Achievement Detail Modal -->
    <div id="achievementModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md card-shadow text-center">
            <div id="achievementContent">
                <!-- Content will be populated by JavaScript -->
            </div>
            <button onclick="hideAchievementDetail()" class="w-full bg-gradient-to-r from-purple-400 to-purple-500 text-white py-3 px-4 rounded-xl font-medium mt-4">
                太棒了！
            </button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-30">
        <div class="flex justify-around py-2">
            <a href="index.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">📋</div>
                <span class="text-xs">家长管理</span>
            </a>
            <a href="child-view.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">👶</div>
                <span class="text-xs">我的任务</span>
            </a>
            <a href="wishes.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">🌟</div>
                <span class="text-xs">心愿管理</span>
            </a>
            <a href="rewards.html" class="flex flex-col items-center py-2 px-4 text-purple-500">
                <div class="text-xl mb-1">🏆</div>
                <span class="text-xs font-medium">成就统计</span>
            </a>
            <a href="help.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">❓</div>
                <span class="text-xs">帮助</span>
            </a>
            <a href="login.html" class="flex flex-col items-center py-2 px-4 text-gray-400">
                <div class="text-xl mb-1">🚪</div>
                <span class="text-xs">切换角色</span>
            </a>
        </div>
    </nav>

    <script>
        // 角色检查
        document.addEventListener('DOMContentLoaded', () => {
            const userRole = localStorage.getItem('userRole');
            const loginTime = localStorage.getItem('loginTime');
            if (!userRole || !loginTime) {
                window.location.href = 'login.html';
                return;
            }
            const loginDate = new Date(loginTime);
            const now = new Date();
            const hoursDiff = (now - loginDate) / (1000 * 60 * 60);
            if (hoursDiff > 24) {
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }
        });
    </script>
    <script src="rewards.js"></script>
</body>
</html>
