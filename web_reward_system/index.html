<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 学习小超人 - 奖励系统</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4A6FA5;
            --secondary: #6B8E23;
            --accent: #FF6B6B;
            --light: #F8F9FA;
            --dark: #343A40;
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* 顶部导航 */
        .navbar {
            background: var(--primary);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .nav-tab {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-tab:hover, .nav-tab.active {
            background: white;
            color: var(--primary);
        }

        /* 主内容区 */
        .main-content {
            padding: 20px;
            display: none;
        }

        .main-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 状态卡片 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--light) 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            color: var(--dark);
            opacity: 0.8;
            font-size: 0.9rem;
        }

        /* 进度条 */
        .progress-container {
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            height: 20px;
            width: 0%;
            transition: width 1s ease-in-out;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 任务卡片 */
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .task-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }

        .task-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .task-reward {
            display: inline-block;
            background: var(--gold);
            color: var(--dark);
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* 商店商品 */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .shop-item {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 2px solid #e9ecef;
        }

        .shop-item.featured {
            border-color: var(--accent);
            position: relative;
        }

        .shop-item.featured::after {
            content: '🔥 热门';
            position: absolute;
            top: -10px;
            right: 10px;
            background: var(--accent);
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        /* 成就徽章 */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .achievement {
            text-align: center;
            opacity: 0.3;
            transition: 0.3s;
        }

        .achievement.unlocked {
            opacity: 1;
        }

        .achievement-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* 按钮 */
        .btn {
            background: linear-gradient(135deg, var(--primary), #5a86d8);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent), #ff8e8e);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--secondary), #8bc34a);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                border-radius: 0;
            }
            
            .nav-tabs {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .tasks-grid, .shop-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 动画效果 */
        .coin-animation {
            position: fixed;
            pointer-events: none;
            animation: coinFly 1s forwards;
            font-size: 1.5rem;
        }

        @keyframes coinFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(100px, -100px) scale(0.5); opacity: 0; }
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            animation: modalIn 0.3s;
        }

        @keyframes modalIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="navbar">
            <div class="logo">
                <i class="fas fa-crown"></i>
                <span>学习小超人</span>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="dashboard">🏠 首页</button>
                <button class="nav-tab" data-tab="tasks">📚 学习</button>
                <button class="nav-tab" data-tab="shop">🎁 商店</button>
                <button class="nav-tab" data-tab="achievements">🏅 成就</button>
                <button class="nav-tab" data-tab="stats">📊 统计</button>
            </div>
        </div>

        <!-- 仪表盘 -->
        <div id="dashboard" class="main-content active">
            <h1 style="margin-bottom: 20px;">🎉 欢迎回来，<span id="studentName">小超人</span>！</h1>
            
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-value" id="coinCount">0</div>
                    <div class="stat-label">零花钱 (元)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💎</div>
                    <div class="stat-value" id="gemCount">0</div>
                    <div class="stat-label">宝石</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⭐</div>
                    <div class="stat-value" id="level">1</div>
                    <div class="stat-label">等级</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-value" id="streakDays">0</div>
                    <div class="stat-label">连续学习</div>
                </div>
            </div>

            <!-- 经验条 -->
            <div style="margin: 30px 0;">
                <h3>🎯 升级进度</h3>
                <div class="progress-container">
                    <div class="progress-bar" id="expBar" style="width: 25%;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 5px;">
                    <span id="currentExp">0</span>
                    <span id="nextLevelExp">100</span>
                </div>
            </div>

            <!-- 任务进度 -->
            <div style="margin: 30px 0;">
                <h3>🎯 本周目标 (完成 > 5 次奖励 3元)</h3>
                <div style="display: flex; align-items: center; gap: 20px; margin: 15px 0;">
                    <div style="flex: 1;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                            <span>📅 本周完成任务数</span>
                            <span id="weeklyProgress">0/6</span>
                        </div>
                        <div class="progress-container" style="height: 10px;">
                            <div class="progress-bar" id="weeklyProgressBar" style="width: 0%; background: #4CAF50;"></div>
                        </div>
                    </div>
                    <button class="btn btn-success" id="claimWeekly" disabled>领取3元奖励</button>
                </div>
            </div>

            <!-- 快速任务 -->
            <h3 style="margin: 30px 0 15px 0;">⚡ 快速学习</h3>
            <div class="tasks-grid">
                <div class="task-card" data-task="math">
                    <div class="task-icon">🔢</div>
                    <h4>数学练习</h4>
                    <p>额外完成10道数学题</p>
                    <div class="task-reward">+1 元</div>
                </div>
                <div class="task-card" data-task="english">
                    <div class="task-icon">🔤</div>
                    <h4>英语单词</h4>
                    <p>额外背10个单词</p>
                    <div class="task-reward">+1 元</div>
                </div>
                <div class="task-card" data-task="reading">
                    <div class="task-icon">📖</div>
                    <h4>语文阅读</h4>
                    <p>阅读20分钟</p>
                    <div class="task-reward">+1 元</div>
                </div>
            </div>
        </div>

        <!-- 学习任务页 -->
        <div id="tasks" class="main-content">
            <h2>📚 学习任务</h2>
            <div class="tasks-grid" id="allTasks">
                <!-- 任务会通过JS动态生成 -->
            </div>
        </div>

        <!-- 商店 -->
        <div id="shop" class="main-content">
            <h2>🎁 学习商店</h2>
            <div class="shop-grid" id="shopItems">
                <!-- 商品会通过JS动态生成 -->
            </div>
        </div>

        <!-- 成就 -->
        <div id="achievements" class="main-content">
            <h2>🏅 成就墙</h2>
            <div class="achievements-grid" id="achievementsList">
                <!-- 成就通过JS动态生成 -->
            </div>
        </div>

        <!-- 统计 -->
        <div id="stats" class="main-content">
            <h2>📊 学习统计</h2>
            <div id="statsContent">
                <!-- 统计图表会在这里生成 -->
            </div>
        </div>
    </div>

    <!-- 任务完成弹窗 -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">任务完成！</h2>
            <p id="modalMessage">恭喜你完成了任务！</p>
            <div style="text-align: center; margin: 20px 0;">
                <div id="modalReward" style="font-size: 3rem;">💰</div>
            </div>
            <button class="btn btn-accent" id="closeModal" style="width: 100%;">太棒了！</button>
        </div>
    </div>

    <!-- 购买确认弹窗 -->
    <div id="buyModal" class="modal">
        <div class="modal-content">
            <h2>确认购买</h2>
            <p id="buyItemName"></p>
            <p id="buyItemPrice"></p>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn" id="cancelBuy" style="flex: 1;">取消</button>
                <button class="btn btn-success" id="confirmBuy" style="flex: 1;">确认购买</button>
            </div>
        </div>
    </div>

    <script>
        // 学习奖励系统
        class LearningRewardSystem {
            constructor() {
                this.loadData();
                this.initEventListeners();
                this.renderAll();
                this.startAutoSave();
            }

            // 加载数据
            loadData() {
                const saved = localStorage.getItem('learningRewardData');
                if (saved) {
                    this.data = JSON.parse(saved);
                } else {
                    this.data = {
                        coins: 0,
                        gems: 0,
                        level: 1,
                        exp: 0,
                        streakDays: 0,
                        lastActive: new Date().toISOString().split('T')[0],
                        tasksCompleted: 0,
                        dailyTasksCompleted: 0,
                        weeklyTasksCompleted: 0,
                        lastWeekReset: new Date().toISOString(), // 记录上一次周重置时间
                        weeklyBonusClaimed: false,
                        subjectStats: {},
                        achievements: [],
                        purchasedItems: [],
                        taskHistory: []
                    };
                }
                
                // 检查连续天数
                this.checkStreak();
                // 检查周重置
                this.checkWeeklyReset();
            }

            // 保存数据
            saveData() {
                localStorage.setItem('learningRewardData', JSON.stringify(this.data));
            }

            // 自动保存
            startAutoSave() {
                setInterval(() => this.saveData(), 30000); // 每30秒自动保存
            }

            // 检查周重置
            checkWeeklyReset() {
                const lastReset = new Date(this.data.lastWeekReset || new Date());
                const now = new Date();
                
                // 获取当前是本周的第几天 (0是周日)
                const day = now.getDay();
                // 获取距离上周一的毫秒数
                const diff = now.getDate() - day + (day == 0 ? -6:1); 
                const currentMonday = new Date(now.setDate(diff));
                currentMonday.setHours(0,0,0,0);

                const lastResetMonday = new Date(lastReset);
                // 简单判断：如果上次重置时间早于本周一，则重置
                // 这里简化逻辑：如果当前时间与上次重置时间相差超过7天，或者跨越了周一
                
                // 更简单的逻辑：记录当前是第几周
                const currentWeekNum = this.getWeekNumber(new Date());
                const lastWeekNum = this.getWeekNumber(new Date(this.data.lastWeekReset));

                if (currentWeekNum !== lastWeekNum) {
                    this.data.weeklyTasksCompleted = 0;
                    this.data.weeklyBonusClaimed = false;
                    this.data.lastWeekReset = new Date().toISOString();
                    console.log("新的一周，数据已重置");
                }
            }

            getWeekNumber(d) {
                d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
                d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
                var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
                var weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
                return weekNo;
            }

            // 检查连续学习天数
            checkStreak() {
                const today = new Date().toISOString().split('T')[0];
                const lastActive = this.data.lastActive;
                
                if (today === lastActive) return; // 今天已经活跃
                
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = yesterday.toISOString().split('T')[0];
                
                if (lastActive === yesterdayStr) {
                    this.data.streakDays++;
                } else if (lastActive !== today) {
                    this.data.streakDays = 1;
                }
                
                this.data.lastActive = today;
                
                // 连续7天奖励
                if (this.data.streakDays % 7 === 0) {
                    this.addCoins(5); // 连续7天奖励5元
                    this.showNotification(`连续学习${this.data.streakDays}天！奖励5元！`);
                }
            }

            // 完成任务
            completeTask(taskType, quantity = 1) {
                const tasks = {
                    math: { name: "数学练习", icon: "🔢", baseReward: 1, exp: 10, desc: "额外完成10道数学题" },
                    english: { name: "英语单词", icon: "🔤", baseReward: 1, exp: 10, desc: "额外背10个单词" },
                    reading: { name: "语文阅读", icon: "📖", baseReward: 1, exp: 10, desc: "阅读20分钟" },
                    science: { name: "科学探索", icon: "🔬", baseReward: 1, exp: 10, desc: "学习科学知识" },
                    art: { name: "艺术创作", icon: "🎨", baseReward: 1, exp: 10, desc: "绘画或手工" },
                    sports: { name: "体育运动", icon: "⚽", baseReward: 1, exp: 10, desc: "运动30分钟" },
                    custom: { name: "自定义任务", icon: "🎯", baseReward: 1, exp: 10, desc: "其他学习任务" }
                };

                const task = tasks[taskType];
                if (!task) return;

                // 计算奖励
                let reward = task.baseReward * quantity;
                let exp = task.exp * quantity;
                
                // 连续学习加成 (可选，这里暂时去掉以保持金额整数，或者保留作为额外的小数点奖励)
                // const streakBonus = Math.min(this.data.streakDays * 0.05, 0.5);
                // reward *= (1 + streakBonus);
                
                // 随机惊喜
                if (Math.random() < 0.05) { // 5%概率
                    reward += 1; // 额外奖励1元
                    task.icon = "🎁";
                    this.showNotification("触发幸运暴击！额外奖励1元！");
                }

                // 更新数据
                this.addCoins(reward);
                this.addExp(exp);
                this.data.tasksCompleted++;
                this.data.dailyTasksCompleted++;
                this.data.weeklyTasksCompleted++;

                // 记录历史
                this.data.taskHistory.push({
                    date: new Date().toISOString(),
                    task: task.name,
                    quantity: quantity,
                    reward: reward,
                    exp: exp
                });

                // 限制历史记录数量
                if (this.data.taskHistory.length > 100) {
                    this.data.taskHistory.shift();
                }

                // 更新科目统计
                if (!this.data.subjectStats[task.name]) {
                    this.data.subjectStats[task.name] = 0;
                }
                this.data.subjectStats[task.name] += quantity;

                // 检查成就
                this.checkAchievements();

                // 显示奖励动画
                this.showRewardAnimation(task.icon, reward, exp);

                // 播放音效
                this.playSound('success');

                this.saveData();
                this.renderAll();
            }

            // 添加金币
            addCoins(amount) {
                this.data.coins += amount; // 允许小数
                this.showFloatingCoin(amount);
            }

            // 添加经验
            addExp(amount) {
                this.data.exp += amount;
                const expNeeded = this.getExpForNextLevel();
                if (this.data.exp >= expNeeded) {
                    this.levelUp();
                }
            }

            // 获取升级所需经验
            getExpForNextLevel() {
                return 100 + (this.data.level - 1) * 50;
            }

            // 升级
            levelUp() {
                this.data.level++;
                this.data.exp = 0;
                this.addCoins(this.data.level * 2); // 升级奖励
                this.showNotification(`🎉 恭喜升级到 ${this.data.level} 级！奖励 ${this.data.level * 2} 元`);
                this.playSound('levelup');
            }

            // 购买商品
            buyItem(itemId, price) {
                if (this.data.coins < price) {
                    this.showNotification("零花钱不足！");
                    this.playSound('error');
                    return false;
                }

                this.data.coins -= price;
                this.data.purchasedItems.push({
                    id: itemId,
                    date: new Date().toISOString(),
                    price: price
                });

                this.showNotification("购买成功！");
                this.playSound('purchase');
                this.saveData();
                this.renderAll();
                return true;
            }

            // 检查成就
            checkAchievements() {
                const achievements = [
                    { id: 'first_task', name: '初次尝试', desc: '完成第一个任务', icon: '🥇', condition: () => this.data.tasksCompleted >= 1 },
                    { id: 'streak_3', name: '渐入佳境', desc: '连续学习3天', icon: '🔥', condition: () => this.data.streakDays >= 3 },
                    { id: 'streak_7', name: '持之以恒', desc: '连续学习7天', icon: '💪', condition: () => this.data.streakDays >= 7 },
                    { id: 'level_5', name: '学习高手', desc: '达到5级', icon: '🌟', condition: () => this.data.level >= 5 },
                    { id: 'coin_100', name: '小富翁', desc: '拥有100元', icon: '💰', condition: () => this.data.coins >= 100 },
                    { id: 'tasks_10', name: '勤奋之星', desc: '完成10个任务', icon: '⭐', condition: () => this.data.tasksCompleted >= 10 },
                    { id: 'tasks_50', name: '学习达人', desc: '完成50个任务', icon: '🏆', condition: () => this.data.tasksCompleted >= 50 },
                    { id: 'all_subjects', name: '全能选手', desc: '完成所有科目任务', icon: '🦸', condition: () => 
                        Object.keys(this.data.subjectStats).length >= 6 }
                ];

                let newAchievements = [];
                achievements.forEach(achievement => {
                    if (!this.data.achievements.includes(achievement.id) && achievement.condition()) {
                        this.data.achievements.push(achievement.id);
                        newAchievements.push(achievement);
                    }
                });

                // 显示新成就
                if (newAchievements.length > 0) {
                    this.showAchievementUnlocked(newAchievements[0]);
                }
            }

            // 显示界面
            renderAll() {
                this.renderDashboard();
                this.renderTasks();
                this.renderShop();
                this.renderAchievements();
                this.renderStats();
            }

            renderDashboard() {
                document.getElementById('coinCount').textContent = this.data.coins.toFixed(1); // 显示一位小数
                document.getElementById('gemCount').textContent = this.data.gems;
                document.getElementById('level').textContent = this.data.level;
                document.getElementById('streakDays').textContent = this.data.streakDays + '天';
                
                const expNeeded = this.getExpForNextLevel();
                const expPercent = (this.data.exp / expNeeded) * 100;
                document.getElementById('expBar').style.width = expPercent + '%';
                document.getElementById('currentExp').textContent = this.data.exp;
                document.getElementById('nextLevelExp').textContent = expNeeded;
                
                // 周任务进度
                const weeklyTarget = 6; // 超过5次，即6次及以上
                const weeklyPercent = (this.data.weeklyTasksCompleted / weeklyTarget) * 100;
                document.getElementById('weeklyProgress').textContent = `${this.data.weeklyTasksCompleted}/${weeklyTarget}`;
                document.getElementById('weeklyProgressBar').style.width = Math.min(weeklyPercent, 100) + '%';

                // 周奖励按钮状态
                const claimBtn = document.getElementById('claimWeekly');
                if (this.data.weeklyTasksCompleted > 5 && !this.data.weeklyBonusClaimed) {
                    claimBtn.disabled = false;
                    claimBtn.textContent = "领取3元奖励";
                    claimBtn.classList.add('pulse'); // 添加跳动效果
                } else if (this.data.weeklyBonusClaimed) {
                    claimBtn.disabled = true;
                    claimBtn.textContent = "本周已领取";
                    claimBtn.classList.remove('pulse');
                } else {
                    claimBtn.disabled = true;
                    claimBtn.textContent = "加油完成任务";
                    claimBtn.classList.remove('pulse');
                }
            }

            renderTasks() {
                const tasks = [
                    { id: 'math', icon: '🔢', name: '数学练习', desc: '额外完成10道数学题', reward: 1 },
                    { id: 'english', icon: '🔤', name: '英语单词', desc: '额外背10个单词', reward: 1 },
                    { id: 'reading', icon: '📖', name: '语文阅读', desc: '阅读20分钟', reward: 1 },
                    { id: 'science', icon: '🔬', name: '科学探索', desc: '学习科学知识', reward: 1 },
                    { id: 'art', icon: '🎨', name: '艺术创作', desc: '绘画或手工', reward: 1 },
                    { id: 'sports', icon: '⚽', name: '体育运动', desc: '运动30分钟', reward: 1 },
                    { id: 'homework', icon: '📝', name: '家庭作业', desc: '完成学校作业', reward: 1 },
                    { id: 'music', icon: '🎵', name: '音乐练习', desc: '练习乐器/唱歌', reward: 1 }
                ];

                const container = document.getElementById('allTasks');
                container.innerHTML = tasks.map(task => `
                    <div class="task-card" data-task="${task.id}">
                        <div class="task-icon">${task.icon}</div>
                        <h4>${task.name}</h4>
                        <p>${task.desc}</p>
                        <div class="task-reward">+${task.reward} 元</div>
                    </div>
                `).join('');
            }

            renderShop() {
                const items = [
                    { id: 'toy', icon: '🧸', name: '小玩具', price: 5, desc: '可爱的毛绒玩具' },
                    { id: 'snack', icon: '🍬', name: '零食礼包', price: 3, desc: '美味小零食组合' },
                    { id: 'book', icon: '📒', name: '绘本', price: 8, desc: '精美绘本', featured: true },
                    { id: 'gametime', icon: '🎮', name: '游戏时间', price: 10, desc: '30分钟游戏时间' },
                    { id: 'movie', icon: '🍿', name: '电影夜', price: 15, desc: '家庭电影之夜' },
                    { id: 'outing', icon: '🚗', name: '周末郊游', price: 30, desc: '周末外出游玩' },
                    { id: 'sticker', icon: '⭐', name: '贴纸套装', price: 2, desc: '卡通贴纸' },
                    { id: 'puzzle', icon: '🧩', name: '益智拼图', price: 12, desc: '智力开发拼图' }
                ];

                const container = document.getElementById('shopItems');
                container.innerHTML = items.map(item => `
                    <div class="shop-item ${item.featured ? 'featured' : ''}" data-item="${item.id}" data-price="${item.price}">
                        <div style="font-size: 3rem; margin-bottom: 10px;">${item.icon}</div>
                        <h4>${item.name}</h4>
                        <p style="color: #666; font-size: 0.9rem; margin: 10px 0;">${item.desc}</p>
                        <div style="display: flex; align-items: center; justify-content: center; gap: 5px; margin: 15px 0;">
                            <span>💰</span>
                            <span style="font-weight: bold; font-size: 1.2rem;">${item.price}</span>
                        </div>
                        <button class="btn" onclick="system.buyItem('${item.id}', ${item.price})" 
                                ${this.data.coins < item.price ? 'disabled style="opacity:0.5;"' : ''}>
                            购买
                        </button>
                    </div>
                `).join('');
            }

            renderAchievements() {
                const achievements = [
                    { id: 'first_task', name: '初次尝试', desc: '完成第一个任务', icon: '🥇' },
                    { id: 'streak_3', name: '渐入佳境', desc: '连续学习3天', icon: '🔥' },
                    { id: 'streak_7', name: '持之以恒', desc: '连续学习7天', icon: '💪' },
                    { id: 'level_5', name: '学习高手', desc: '达到5级', icon: '🌟' },
                    { id: 'coin_100', name: '小富翁', desc: '拥有100元', icon: '💰' },
                    { id: 'tasks_10', name: '勤奋之星', desc: '完成10个任务', icon: '⭐' },
                    { id: 'tasks_50', name: '学习达人', desc: '完成50个任务', icon: '🏆' },
                    { id: 'all_subjects', name: '全能选手', desc: '完成所有科目任务', icon: '🦸' }
                ];

                const container = document.getElementById('achievementsList');
                container.innerHTML = achievements.map(ach => `
                    <div class="achievement ${this.data.achievements.includes(ach.id) ? 'unlocked' : ''}">
                        <div class="achievement-icon">${ach.icon}</div>
                        <h4>${ach.name}</h4>
                        <p style="color: #666; font-size: 0.9rem;">${ach.desc}</p>
                        <div style="margin-top: 10px; font-size: 0.8rem; color: ${this.data.achievements.includes(ach.id) ? '#4CAF50' : '#999'}">
                            ${this.data.achievements.includes(ach.id) ? '✅ 已解锁' : '🔒 未解锁'}
                        </div>
                    </div>
                `).join('');
            }

            renderStats() {
                const container = document.getElementById('statsContent');
                
                // 创建简单的图表
                const statsHTML = `
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px;">
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 10px;">
                            <h4>📈 学习统计</h4>
                            <p>总任务数: ${this.data.tasksCompleted}</p>
                            <p>连续学习: ${this.data.streakDays} 天</p>
                            <p>当前等级: ${this.data.level}</p>
                            <p>拥有零花钱: ${this.data.coins.toFixed(1)} 元</p>
                        </div>
                        
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 10px;">
                            <h4>📊 科目分布</h4>
                            ${Object.entries(this.data.subjectStats).map(([subject, count]) => `
                                <div style="margin: 10px 0;">
                                    <div style="display: flex; justify-content: space-between;">
                                        <span>${subject}</span>
                                        <span>${count} 次</span>
                                    </div>
                                    <div style="height: 5px; background: #ddd; border-radius: 3px; margin-top: 5px;">
                                        <div style="height: 100%; width: ${Math.min(count * 10, 100)}%; background: #4A6FA5; border-radius: 3px;"></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 10px;">
                            <h4>📅 近期记录</h4>
                            ${this.data.taskHistory.slice(-5).reverse().map(record => `
                                <div style="margin: 10px 0; padding: 10px; background: white; border-radius: 5px;">
                                    <div style="display: flex; justify-content: space-between;">
                                        <strong>${record.task}</strong>
                                        <span>+${record.reward.toFixed(1)}元</span>
                                    </div>
                                    <div style="color: #666; font-size: 0.9rem;">
                                        ${new Date(record.date).toLocaleString()}
                                    </div>
                                </div>
                            `).join('') || '<p style="color: #999;">暂无记录</p>'}
                        </div>
                    </div>
                `;
                
                container.innerHTML = statsHTML;
            }

            // 事件监听
            initEventListeners() {
                // 导航切换
                document.querySelectorAll('.nav-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                        document.querySelectorAll('.main-content').forEach(c => c.classList.remove('active'));
                        
                        tab.classList.add('active');
                        document.getElementById(tab.dataset.tab).classList.add('active');
                    });
                });

                // 任务点击
                document.addEventListener('click', (e) => {
                    const taskCard = e.target.closest('.task-card');
                    if (taskCard) {
                        const taskId = taskCard.dataset.task;
                        this.completeTask(taskId);
                    }
                });

                // 模态框关闭
                document.getElementById('closeModal').addEventListener('click', () => {
                    document.getElementById('taskModal').classList.remove('active');
                });

                // 每周奖励领取
                document.getElementById('claimWeekly').addEventListener('click', () => {
                    if (this.data.weeklyTasksCompleted > 5 && !this.data.weeklyBonusClaimed) {
                        this.addCoins(3);
                        this.data.weeklyBonusClaimed = true;
                        this.showNotification('领取每周奖励：3元！');
                        this.saveData();
                        this.renderAll();
                    }
                });

                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        if (e.key === 's') {
                            e.preventDefault();
                            this.saveData();
                            this.showNotification('已保存！');
                        } else if (e.key === 'r') {
                            e.preventDefault();
                            location.reload();
                        }
                    }
                });
            }

            // 显示奖励动画
            showRewardAnimation(icon, coins, exp) {
                const modal = document.getElementById('taskModal');
                document.getElementById('modalTitle').textContent = '任务完成！';
                document.getElementById('modalMessage').textContent = `获得 ${coins.toFixed(1)} 元 和 ${exp} 经验`;
                document.getElementById('modalReward').textContent = icon;
                modal.classList.add('active');

                // 添加浮动金币效果
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        this.showFloatingCoin(coins);
                    }, i * 200);
                }
            }

            // 浮动金币效果
            showFloatingCoin(amount) {
                const coin = document.createElement('div');
                coin.className = 'coin-animation';
                coin.textContent = '💰';
                coin.style.position = 'fixed';
                coin.style.left = '50%';
                coin.style.top = '50%';
                coin.style.zIndex = '10000';
                coin.style.pointerEvents = 'none';
                
                document.body.appendChild(coin);
                
                // 随机飞行方向
                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 50;
                
                coin.animate([
                    { 
                        transform: 'translate(0, 0) scale(1)',
                        opacity: 1
                    },
                    { 
                        transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0.5)`,
                        opacity: 0
                    }
                ], {
                    duration: 1000,
                    easing: 'ease-out'
                }).onfinish = () => {
                    document.body.removeChild(coin);
                };
            }

            // 显示成就解锁
            showAchievementUnlocked(achievement) {
                const modal = document.getElementById('taskModal');
                document.getElementById('modalTitle').textContent = '🎉 解锁成就！';
                document.getElementById('modalMessage').textContent = achievement.desc;
                document.getElementById('modalReward').textContent = achievement.icon;
                modal.classList.add('active');
                
                this.playSound('achievement');
            }

            // 显示通知
            showNotification(message) {
                // 创建通知元素
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #4CAF50;
                    color: white;
                    padding: 15px 20px;
                    border-radius: 10px;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                    z-index: 1000;
                    animation: slideIn 0.3s ease-out;
                `;
                
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.style.animation = 'slideOut 0.3s ease-in forwards';
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
                
                // 添加动画样式
                if (!document.getElementById('notificationStyles')) {
                    const style = document.createElement('style');
                    style.id = 'notificationStyles';
                    style.textContent = `
                        @keyframes slideIn {
                            from { transform: translateX(100%); opacity: 0; }
                            to { transform: translateX(0); opacity: 1; }
                        }
                        @keyframes slideOut {
                            from { transform: translateX(0); opacity: 1; }
                            to { transform: translateX(100%); opacity: 0; }
                        }
                    `;
                    document.head.appendChild(style);
                }
            }

            // 播放音效
            playSound(type) {
                // 这里可以添加音效文件
                // 简单的音频提示
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    if (type === 'success') {
                        oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                        oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
                    } else if (type === 'levelup') {
                        oscillator.frequency.setValueAtTime(261.63, audioContext.currentTime); // C4
                        oscillator.frequency.setValueAtTime(329.63, audioContext.currentTime + 0.1); // E4
                        oscillator.frequency.setValueAtTime(392.00, audioContext.currentTime + 0.2); // G4
                    } else if (type === 'achievement') {
                        oscillator.frequency.setValueAtTime(784.00, audioContext.currentTime); // G5
                    } else if (type === 'purchase') {
                        oscillator.frequency.setValueAtTime(392.00, audioContext.currentTime); // G4
                    } else if (type === 'error') {
                        oscillator.frequency.setValueAtTime(220.00, audioContext.currentTime); // A3
                    }
                    
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.5);
                } catch (e) {
                    console.log('音频播放失败，浏览器可能不支持');
                }
            }
        }

        // 初始化系统
        const system = new LearningRewardSystem();

        // 添加一些CSS动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-10px); }
            }
            
            .task-card:hover .task-icon {
                animation: float 0.5s ease-in-out;
            }
            
            .pulse {
                animation: pulse 2s infinite;
            }
            
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.05); }
                100% { transform: scale(1); }
            }
            
            .coin-count {
                display: inline-block;
                transition: transform 0.3s;
            }
            
            .coin-update {
                transform: scale(1.2);
            }
        `;
        document.head.appendChild(style);

        // 页面加载动画
        document.addEventListener('DOMContentLoaded', () => {
            // 添加加载动画
            setTimeout(() => {
                document.querySelector('.container').style.opacity = '1';
                document.querySelector('.container').style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
