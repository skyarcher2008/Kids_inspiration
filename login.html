<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小勇士任务 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <!-- 使用系统默认无衬线字体作为后备方案 -->
    <style>
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background: linear-gradient(135deg, #FFE5E5 0%, #E5F3FF 50%, #E5FFE5 100%);
            min-height: 100vh;
        }
        .hero-bg {
            background-image: url('hero-background.png');
            background-size: cover;
            background-position: center;
        }
        .card-shadow {
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .gradient-text {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .floating-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .role-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .role-selected {
            border: 3px solid #FF6B6B;
            background: linear-gradient(135deg, #FFE5E5, #E5F3FF);
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <div class="hero-bg h-64 flex items-center justify-center relative overflow-hidden">
        <div class="absolute inset-0 bg-white bg-opacity-20"></div>
        <div class="relative text-center z-10">
            <div class="floating-animation">
                <h1 class="text-4xl font-bold gradient-text mb-2">小勇士任务</h1>
                <p class="text-gray-700 text-lg">选择你的角色，开始冒险之旅！</p>
            </div>
        </div>
        <!-- Floating Stars -->
        <div class="absolute top-4 left-4 w-8 h-8 bg-yellow-300 rounded-full opacity-70 floating-animation"></div>
        <div class="absolute top-12 right-8 w-6 h-6 bg-pink-300 rounded-full opacity-60 floating-animation" style="animation-delay: 1s;"></div>
        <div class="absolute bottom-8 left-12 w-7 h-7 bg-blue-300 rounded-full opacity-50 floating-animation" style="animation-delay: 2s;"></div>
    </div>

    <!-- Role Selection -->
    <div class="px-4 -mt-8 relative z-20">
        <div class="bg-white rounded-2xl p-6 card-shadow">
            <h2 class="text-2xl font-semibold text-gray-800 text-center mb-6">选择你的角色</h2>
            
            <div class="grid grid-cols-1 gap-6 mb-6">
                <!-- Parent Role -->
                <div id="parentCard" class="role-card bg-gradient-to-br from-blue-50 to-blue-100 rounded-2xl p-6 border-2 border-transparent">
                    <div class="text-center">
                        <div class="text-6xl mb-4">👨‍👩‍👧‍👦</div>
                        <h3 class="text-xl font-bold text-blue-700 mb-2">家长</h3>
                        <p class="text-blue-600 text-sm mb-4">创建任务、审核完成、管理心愿</p>
                        <div class="space-y-2 text-xs text-blue-500">
                            <div>✓ 创建和管理任务</div>
                            <div>✓ 审核孩子完成情况</div>
                            <div>✓ 设定心愿积分要求</div>
                            <div>✓ 查看统计数据</div>
                        </div>
                    </div>
                </div>

                <!-- Child Role -->
                <div id="childCard" class="role-card bg-gradient-to-br from-pink-50 to-pink-100 rounded-2xl p-6 border-2 border-transparent">
                    <div class="text-center">
                        <div class="text-6xl mb-4">👶</div>
                        <h3 class="text-xl font-bold text-pink-700 mb-2">孩子</h3>
                        <p class="text-pink-600 text-sm mb-4">完成任务、积累积分、实现心愿</p>
                        <div class="space-y-2 text-xs text-pink-500">
                            <div>✓ 查看每日任务</div>
                            <div>✓ 完成任务获得积分</div>
                            <div>✓ 设定和兑换心愿</div>
                            <div>✓ 解锁成就徽章</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Parent Password Input (Hidden by default) -->
            
        </div>
    </div>

    <!-- Features Preview -->
    <div class="px-4 mt-6">
        <div class="bg-white rounded-2xl p-6 card-shadow">
            <h3 class="text-lg font-semibold text-gray-800 text-center mb-4">应用特色</h3>
            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="bg-yellow-50 rounded-xl p-3">
                    <div class="text-2xl mb-2">🎯</div>
                    <div class="text-sm font-medium text-gray-800">目标管理</div>
                    <div class="text-xs text-gray-600">设定任务和心愿</div>
                </div>
                <div class="bg-green-50 rounded-xl p-3">
                    <div class="text-2xl mb-2">🏆</div>
                    <div class="text-sm font-medium text-gray-800">成就系统</div>
                    <div class="text-xs text-gray-600">解锁各种徽章</div>
                </div>
                <div class="bg-blue-50 rounded-xl p-3">
                    <div class="text-2xl mb-2">📊</div>
                    <div class="text-sm font-medium text-gray-800">数据统计</div>
                    <div class="text-xs text-gray-600">可视化成长曲线</div>
                </div>
                <div class="bg-purple-50 rounded-xl p-3">
                    <div class="text-2xl mb-2">🎨</div>
                    <div class="text-sm font-medium text-gray-800">精美设计</div>
                    <div class="text-xs text-gray-600">友好的交互体验</div>
                </div>
            </div>

            <div id="passwordSection" class="mt-4 hidden">
                <label class="block text-sm font-medium text-gray-700 mb-2">家长密码</label>
                <input type="password" id="parentPassword" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="请输入家长密码">
                <p class="text-xs text-gray-500 mt-1">默认密码：123</p>
                <button id="parentLoginButton" onclick="loginParent()" class="w-full mt-3 bg-gradient-to-r from-blue-400 to-blue-500 text-white py-3 px-4 rounded-xl font-medium text-sm hover:shadow-lg transition-all duration-300 transform hover:scale-105">登录</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('parentCard').addEventListener('click', () => {
            document.getElementById('parentCard').classList.add('role-selected');
            document.getElementById('childCard').classList.remove('role-selected');
            const section = document.getElementById('passwordSection');
            section.classList.remove('hidden');
            const input = document.getElementById('parentPassword');
            input.focus();
            function onKey(e){
                if(e.key==='Enter'){
                    const savedPassword = localStorage.getItem('parentPassword') || '123';
                    if(input.value !== savedPassword){
                        showLoginError('家长密码错误！');
                        return;
                    }
                    localStorage.setItem('userRole','parent');
                    localStorage.setItem('loginTime', new Date().toISOString());
                    window.location.href = 'index.html';
                }
            }
            input.addEventListener('keydown', onKey, { once: true });
            anime({ targets: '#parentCard', scale: [1, 1.05, 1], duration: 400, easing: 'easeOutQuad' });
        });

        function loginParent(){
            const input = document.getElementById('parentPassword');
            const savedPassword = localStorage.getItem('parentPassword') || '123';
            if(input.value !== savedPassword){
                showLoginError('家长密码错误！');
                return;
            }
            localStorage.setItem('userRole','parent');
            localStorage.setItem('loginTime', new Date().toISOString());
            window.location.href = 'index.html';
        }

        document.getElementById('childCard').addEventListener('click', () => {
            document.getElementById('childCard').classList.add('role-selected');
            document.getElementById('parentCard').classList.remove('role-selected');
            localStorage.setItem('userRole','child');
            localStorage.setItem('loginTime', new Date().toISOString());
            window.location.href = 'child-view.html';
        });

        function showLoginError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-4 py-2 rounded-lg z-50 text-sm font-medium';
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);

            anime({
                targets: errorDiv,
                translateY: [-20, 0],
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutQuad'
            });

            setTimeout(() => {
                anime({
                    targets: errorDiv,
                    translateY: [0, -20],
                    opacity: [1, 0],
                    duration: 300,
                    easing: 'easeInQuad',
                    complete: () => {
                        if (document.body.contains(errorDiv)) {
                            document.body.removeChild(errorDiv);
                        }
                    }
                });
            }, 3000);
        }

        // 页面加载动画
        document.addEventListener('DOMContentLoaded', () => {
            anime({
                targets: '.floating-animation',
                scale: [0.8, 1],
                opacity: [0, 1],
                duration: 1000,
                easing: 'easeOutQuad',
                delay: 300
            });

            anime({
                targets: '.role-card',
                translateY: [30, 0],
                opacity: [0, 1],
                duration: 800,
                delay: anime.stagger(200, {start: 500}),
                easing: 'easeOutQuad'
            });
        });
    </script>
</body>
</html>
